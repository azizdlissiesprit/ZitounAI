server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m; # parcel images for M6 (15 MB max)

    # Same origin for the app and the API: no CORS needed in Docker.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s; # M6 automatic zoom can take up to 60 s on CPU
    }

    # Angular routes (/parcels/3, /diagnosis…) all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
